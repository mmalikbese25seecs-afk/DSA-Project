<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a paper | Papertrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="index.html">Papertrail</a>
  <nav aria-label="Main"><a href="index.html">Search</a><a href="add.html" aria-current="page">Add paper</a></nav>
</header>
<main id="main">
  <h1>Add a paper</h1>
  <p class="lead">New papers become searchable within a minute.</p>
  <div class="tabs" role="tablist" aria-label="How to add">
    <button role="tab" id="t-json" aria-controls="p-json" aria-selected="true">JSON file</button>
    <button role="tab" id="t-text" aria-controls="p-text" aria-selected="false" tabindex="-1">Text file</button>
    <button role="tab" id="t-manual" aria-controls="p-manual" aria-selected="false" tabindex="-1">Enter manually</button>
  </div>

  <section class="panel" id="p-json" role="tabpanel" aria-labelledby="t-json">
    <form data-kind="json">
      <label for="f-json">JSON file (same format as the dataset)</label>
      <input id="f-json" name="file" type="file" accept=".json,.jsonl" required>
      <p class="hint">One paper or a list of papers with id, title, abstract, authors and categories.</p>
      <p><button type="submit">Add papers</button></p>
    </form>
  </section>

  <section class="panel" id="p-text" role="tabpanel" aria-labelledby="t-text" hidden>
    <form data-kind="text">
      <label for="f-text">Text file (.txt)</label>
      <input id="f-text" name="file" type="file" accept=".txt" required>
      <p class="hint">First line is the title. The rest is the abstract.</p>
      <p><button type="submit">Add paper</button></p>
    </form>
  </section>

  <section class="panel" id="p-manual" role="tabpanel" aria-labelledby="t-manual" hidden>
    <form data-kind="manual">
      <label for="m-title">Title</label><input id="m-title" name="title" required>
      <label for="m-abs">Abstract</label><textarea id="m-abs" name="abstract" rows="6" required></textarea>
      <label for="m-auth">Authors</label><input id="m-auth" name="authors" placeholder="Ada Lovelace, Alan Turing">
      <p class="hint">Separate names with commas.</p>
      <label for="m-cat">Categories</label><input id="m-cat" name="categories" placeholder="cs.AI, cs.LG">
      <p><button type="submit">Add paper</button></p>
    </form>
  </section>
  <div id="msg" class="msg" role="status" hidden></div>
</main>
<script src="app.js"></script>
</body>
</html>
